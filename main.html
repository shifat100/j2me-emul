<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <title>J2ME</title>
  <link rel="stylesheet" type="text/css" href="style/main.css">
  <link rel="stylesheet" type="text/css" href="style/lcdui.css">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12151b">
  <script src="https://shifat100.github.io/key-simulator/Keysim-min.js"></script>
  <script>
    window.addEventListener('back', function (event) {
      event.preventDefault();
      if (typeof simulateNaturalPress === 'function') {
        simulateNaturalPress('SoftRight', 0);
      }
    });
  </script>
  <script src="config/i18n.js"></script>
  <script src="libs/encoding.js"></script>
  <script src="./libs/webaudio-tinysynth.min.js" type="text/javascript"></script>
  <script src="./libs/BenzAMRRecorder.min.js" type="text/javascript"></script>

  <script type="text/javascript" src="bld/native.js" defer></script>
  <script type="text/javascript" src="config/default.js" defer></script>
  <script type="text/javascript" src="config/settings.js" defer></script>
  <script type="text/javascript" src="config/localjars.js" defer></script>
  <script type="text/javascript" src="config/urlparams.js" defer></script>
  <script type="text/javascript" src="screen.js" defer></script>

  <script type="text/javascript" src="bld/j2me.js" defer></script>

  <script type="text/javascript" src="bld/main-all.js" defer></script>
  <script type="text/javascript" src="bld/lcdui.js" defer></script>
  <script type="text/javascript" src="bld/net.js" defer></script>
  <script type="text/javascript" src="btroom.js" defer></script>
  <script type="text/javascript" src="bld/bt.js" defer></script>
  <script type="text/javascript" src="bld/media.js" defer></script>
  <script type="text/javascript" src="bld/micro3d.js" defer></script>
  <script type="text/javascript" src="bld/m3g.js" defer></script>
  <script type="text/javascript" src="files.js" defer></script>
  <script type="text/javascript" src="panel.js" defer></script>

  <script type="text/javascript" src="keymap.js"></script>

</head>

<body class="kaios-ui keypad-hidden">
  <div id="editor-layer">
    <div id="textarea-editor" class="textEditor" contenteditable="true"></div>
    <input id="password-editor" class="textEditor" type="password">
    <input id="email-editor" class="textEditor" type="email">
    <input id="number-editor" class="textEditor" type="number">
    <input id="tel-editor" class="textEditor" type="tel">
    <input id="url-editor" class="textEditor" type="url">
  </div>
  <div id="display-container">
    <div id="display">
      <canvas id="canvas"></canvas>
      <div id="download-screen" class="screen">
        <h1 class="title" data-en="Loading…">Загрузка…</h1>
        <div class="download-progress-container">
          <progress class="pack-activity" id="download-bar" value="0" max="100"></progress>
        </div>
      </div>

      <div id="splash-screen" class="screen">
        <h1 class="title" data-en="Starting…">Запуск…</h1>
        <div class="splash-progress-container">
          <progress></progress>
        </div>
      </div>

      <div id="exit-screen" class="screen">
      </div>

      <div id="background-screen">
      </div>
    </div>
  </div>

  <div id="keypad" style="display:none" hidden></div>
</body>

</html>
